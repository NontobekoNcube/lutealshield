<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bloomy • LutealShield Companion</title>
  <meta name="description" content="Bloomy is your cycle-aligned PMDD grounding companion." />
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#2D1B4E" />
</head>
<body>
  <div class="app-container" style="display: flex; flex-direction: column; height: 100vh;">
    <!-- Header -->
    <header class="app-header" style="flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="/index.html" class="icon-btn" aria-label="Go Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 38px; height: 38px; border-radius: 50%; background: #FAF7F2; border: 1.5px solid rgba(45, 27, 78, 0.15); display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <img src="/bloomy.svg" alt="Bloomy" style="width: 32px; height: 32px;" />
          </div>
          <div>
            <div style="font-weight: 700; font-size: 0.95rem; color: var(--text);">Bloomy</div>
            <div style="font-size: 0.72rem; color: #4A8C6E; font-weight: 600; display: flex; align-items: center; gap: 4px;">
              <span class="pulse-dot"></span> Holding space
            </div>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <span class="safe-space-badge">
          Zero Judgment
        </span>
      </div>
    </header>

    <!-- Chat Messages Container -->
    <main class="chat-container" id="chatContainer">
      <!-- Welcome message from Bloomy -->
      <div class="chat-msg bloomy">
        <p style="margin: 0 0 6px 0;">
          Hello, dear heart. I am right here with you. Whatever storm is happening in your body today, remember: <strong>you are safe, your brain is navigating a chemical shift, and this will pass.</strong>
        </p>
        <span style="font-size: 0.68rem; opacity: 0.75; display: block;">Bloomy • Just now</span>
      </div>
    </main>

    <!-- Interactive Prompt Suggestions -->
    <div class="chat-suggestions-scroll" style="flex-shrink: 0;">
      <button class="chat-suggestion-chip" onclick="sendQuickPrompt('I want to quit everything right now')">
        “I want to quit everything right now”
      </button>
      <button class="chat-suggestion-chip" onclick="sendQuickPrompt('Everyone is secretly mad at me')">
        “Everyone is secretly mad at me”
      </button>
      <button class="chat-suggestion-chip" onclick="sendQuickPrompt('Can you hold space with me?')">
        “Can you hold space with me?”
      </button>
      <button class="chat-suggestion-chip" onclick="sendQuickPrompt('Activate 72h Decision Buffer')">
        “Activate 72h Decision Buffer”
      </button>
    </div>

    <!-- Chat Input Bar -->
    <form class="chat-input-bar" id="chatForm" onsubmit="handleChatSubmit(event)">
      <input type="text" id="chatInput" class="form-input" placeholder="Whisper to Bloomy softly..." autocomplete="off" style="font-size: 0.88rem; padding: 12px 14px;" />
      <button type="submit" id="sendBtn" class="chat-send-btn" aria-label="Send Message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="/index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="/plan.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span>Plan</span>
      </a>
      <a href="/bloomy.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Bloomy</span>
      </a>
      <a href="/pocket.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"></circle><line x1="12" y1="22" x2="12" y2="8"></line><path d="M5 12H2a10 10 0 0 0 20 0h-3"></path></svg>
        <span>Pocket</span>
      </a>
      <a href="/support.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Support</span>
      </a>
    </nav>
  </div>

  <script src="/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Zone greeting check
      const zone = localStorage.getItem('lutealshield_zone') || 'green';
      const container = document.getElementById('chatContainer');
      if (zone === 'red') {
        const redMsg = document.createElement('div');
        redMsg.className = 'chat-msg bloomy';
        redMsg.innerHTML = `
          <p style="margin: 0 0 6px 0;">
            🌸 <strong>Red Zone Active:</strong> I see you are in your high-intensity days. I will keep my responses extra short and low-stimulation. Put on your headphones and take a breath with me.
          </p>
          <span style="font-size: 0.68rem; opacity: 0.75; display: block;">Bloomy • Red Zone Mode</span>
        `;
        container.appendChild(redMsg);
      }
    });

    function sendQuickPrompt(text) {
      document.getElementById('chatInput').value = text;
      handleChatSubmit(new Event('submit'));
    }

    async function handleChatSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendUserMessage(text);

      // Show typing indicator
      const typingEl = appendTypingIndicator();

      // Gather contextual data from localStorage as per prompt spec
      const symptoms = JSON.parse(localStorage.getItem('lutealshield_symptoms') || '[]');
      const pocket = JSON.parse(localStorage.getItem('lutealshield_pocket') || '[]');
      const currentZone = localStorage.getItem('lutealshield_zone') || 'green';
        try {
        const response = await fetch('https://lutealshield.onrender.com/api/bloomy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            symptoms: symptoms,
            pocket: pocket,
            zone: currentZone
          })
        });

        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        typingEl.remove();
        appendBloomyMessage(data.response || "I hear you softly, and I am right here with you.");
      } catch (err) {
        typingEl.remove();
        appendBloomyMessage("Bloomy is resting 💜 Look through your Affirmations Pocket while you wait.");
      }
    }

    function appendUserMessage(text) {
      const container = document.getElementById('chatContainer');
      const msg = document.createElement('div');
      msg.className = 'chat-msg user';
      msg.innerHTML = `
        <p style="margin: 0 0 4px 0;">${escapeHTML(text)}</p>
        <span style="font-size: 0.65rem; opacity: 0.7; display: block; text-align: right;">You</span>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      playCalmTone(0.8);
    }

    function appendBloomyMessage(text) {
      const container = document.getElementById('chatContainer');
      const msg = document.createElement('div');
      msg.className = 'chat-msg bloomy';
      msg.innerHTML = `
        <p style="margin: 0 0 6px 0;">${escapeHTML(text)}</p>
        <span style="font-size: 0.68rem; opacity: 0.75; display: block;">Bloomy</span>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      playCalmTone(1.4);
    }

    function appendTypingIndicator() {
      const container = document.getElementById('chatContainer');
      const msg = document.createElement('div');
      msg.className = 'chat-msg bloomy';
      msg.id = 'typingIndicator';
      msg.innerHTML = `
        <div style="display: flex; align-items: center; gap: 6px; padding: 4px 0;">
          <span class="pulse-dot" style="background: var(--primary);"></span>
          <span style="font-size: 0.78rem; font-style: italic; color: var(--text-muted);">Bloomy is breathing with you...</span>
        </div>
      `;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
