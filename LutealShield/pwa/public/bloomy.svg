<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="faceGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2EAFA"/>
      <stop offset="70%" stop-color="#E1D0F5"/>
      <stop offset="100%" stop-color="#D0BDE8"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D1B4E" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Mascot Body -->
  <circle cx="128" cy="138" r="96" fill="url(#faceGrad)" stroke="#8F62C7" stroke-width="7" filter="url(#softShadow)"/>

  <!-- Top Sprout Leaves -->
  <!-- Left Leaf -->
  <path d="M 128 42 C 122 34 110 32 108 40 C 106 48 116 52 128 52 Z" fill="#52B788"/>
  <!-- Right Leaf -->
  <path d="M 128 42 C 134 32 148 30 150 38 C 152 46 140 52 128 52 Z" fill="#40916C"/>

  <!-- Left Eye -->
  <ellipse cx="88" cy="130" rx="9.5" ry="13.5" fill="#2D1B4E"/>
  <circle cx="91" cy="125" r="3.5" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="168" cy="130" rx="9.5" ry="13.5" fill="#2D1B4E"/>
  <circle cx="171" cy="125" r="3.5" fill="#FFFFFF"/>

  <!-- Left Blush -->
  <ellipse cx="76" cy="148" rx="14" ry="10" fill="#F8B4D9" opacity="0.85"/>

  <!-- Right Blush -->
  <ellipse cx="180" cy="148" rx="14" ry="10" fill="#F8B4D9" opacity="0.85"/>

  <!-- Gentle Smile -->
  <path d="M 106 156 Q 128 175 150 156" fill="none" stroke="#2D1B4E" stroke-width="5.5" stroke-linecap="round"/>
</svg>
